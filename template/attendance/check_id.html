<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davomat Terminali</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .terminal-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
        }
        .id-input {
            font-size: 22px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="terminal-box text-center">
    <h3 class="fw-bold text-dark mb-3">KIRISH / CHIQISH</h3>
    <p class="text-muted small">ID raqamingizni kiriting va Enter tugmasini bosing</p>

    <hr>

    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% else %}alert-success{% endif %} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form action="" method="POST" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            <input type="text"
                   name="staff_id"
                   class="form-control id-input p-3"
                   placeholder="ID RAQAMINI YOZING"
                   autofocus
                   required
                   autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">TASDIQLASH</button>
    </form>

    <div class="mt-4 text-muted small">
        Sana: {% now "Y-m-d" %} | Vaqt: {% now "H:i" %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Agar ekranda xabar paydo bo'lsa, 5 soniyadan keyin o'zi avtomatik yo'qoladi
    setTimeout(function() {
        let alert = document.querySelector('.alert');
        if (alert) {
            let bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        }
    }, 5000);
</script>

</body>
</html>
