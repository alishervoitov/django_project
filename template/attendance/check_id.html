<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .terminal-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
        }
        .id-input {
            font-size: 22px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="terminal-box text-center">
    <h3 class="fw-bold text-dark mb-3">KIRISH / CHIQISH</h3>
    <p class="text-muted small">ID raqamingizni kiriting va Enter tugmasini bosing</p>

    <hr>

    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% else %}alert-success{% endif %} alert-dismissible fade show text-start small" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form action="{% url 'check_id_page' %}" method="POST" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            <input type="text"
                   name="staff_id"
                   class="form-control id-input p-3"
                   placeholder="ID RAQAMINI YOZING"
                   autofocus
                   required
                   autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">TASDIQLASH</button>
    </form>

    <div class="mt-4 text-muted small">
        Sana: {% now "Y-m-d" %} | Vaqt: <span id="live-clock" class="fw-bold">{% now "H:i:s" %}</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 1. VAQTNI JONLI (REAL-TIME) YANGILASH FUNKSIYASI
    function startLiveClock() {
        const timeDisplay = document.getElementById('live-clock');
        if (!timeDisplay) return;

        setInterval(() => {
            const now = new Date();

            // Soat, minut va sekundlarni ikki xonali qilib olish (masalan: 09:05:02)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;
        }, 1000); // Har 1 soniyada (1000 millisoniya) qayta ishlaydi
    }

    // Sahifa yuklanishi bilan soatni ishga tushiramiz
    document.addEventListener('DOMContentLoaded', startLiveClock);

    // 2. Alert xabarlarni 8 soniyadan keyin avtomatik yopish logikasi
    setTimeout(function() {
        let alert = document.querySelector('.alert');
        if (alert) {
            let bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        }
    }, 8000);
</script>

</body>
</html>
