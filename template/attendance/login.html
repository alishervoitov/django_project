<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga Kirish - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #2c3e50, #18bc9c);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="display-4 text-success mb-2"><i class="bi bi-shield-lock-fill"></i></div>
        <h3 class="fw-bold text-dark">Boshqaruv Paneli</h3>
        <p class="text-muted small">Tizimga kirish uchun admin ma'lumotlarini kiriting</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show small py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                <button type="submit" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login_page' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Admin ID (Staff ID):</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-person-badge"></i></span>
                <input type="text" name="staff_id" class="form-control" placeholder="Masalan: admin1" required autocomplete="off">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold text-secondary">Maxfiy Parol:</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-key-fill"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i> Tizimga Kirish
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
